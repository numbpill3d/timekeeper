name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: timekeeper-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python tests and contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: >-
          python -m pip install
          "pytest>=8.0.0"
          "pytest-asyncio>=0.23.0"
          "fastapi>=0.109.0"
          "pydantic>=2.5.0"
          "bcrypt>=4.0.0"
          "PyJWT>=2.10.1"
          "email-validator>=2.1.0"
          "asyncpg>=0.29.0"
          "aiokafka>=0.10.0"
          "redis>=5.0.0"
          "httpx>=0.26.0"
          "boto3>=1.34.0"
          "numpy>=1.26.0"
          "opencv-python-headless>=4.8.0"
          "ruff>=0.8.0"
          "pip-audit>=2.7.0"
          "setuptools>=84.1.0"
      - name: Test
        run: pytest -q
      - name: Lint
        run: ruff check api services shared tests
      - name: Bug-pattern lint
        run: ruff check --select B api services shared tests
      - name: Compile Python sources
        run: python -m compileall -q api services shared tests
      - name: Audit Python dependencies
        run: pip-audit --strict
      - name: Build shared package
        run: python -m pip wheel ./shared --no-deps --no-build-isolation --wheel-dir "$RUNNER_TEMP/timekeeper-shared-wheel"

  web:
    name: Web build and audit
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  mobile:
    name: Mobile type-check and audit
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx expo-doctor
      - run: npm audit --omit=dev --audit-level=high

  compose:
    name: Compose configuration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose file
        run: docker compose --env-file .env.example config --quiet

  runtime-audit:
    name: Runtime dependency audit (Python 3.11 / ${{ matrix.requirements }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        requirements:
          - requirements.txt
          - api/requirements.txt
          - services/alert-engine/requirements.txt
          - services/event-processor/requirements.txt
          - services/ingestion/requirements.txt
          - services/query-engine/requirements.txt
          - services/vision/requirements.txt
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install audit tool
        run: python -m pip install "pip-audit>=2.7.0" "setuptools>=84.1.0"
      - name: Audit declared runtime requirements
        run: pip-audit --strict -r "${{ matrix.requirements }}"
