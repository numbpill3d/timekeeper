name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: timekeeper-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python tests and contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: >-
          python -m pip install
          "pytest>=8.0.0"
          "pytest-asyncio>=0.23.0"
          "fastapi>=0.109.0"
          "pydantic>=2.5.0"
          "bcrypt>=4.0.0"
          "python-jose[cryptography]>=3.3.0"
          "email-validator>=2.1.0"
          "asyncpg>=0.29.0"
          "aiokafka>=0.10.0"
          "redis>=5.0.0"
          "httpx>=0.26.0"
          "boto3>=1.34.0"
          "numpy>=1.26.0"
          "opencv-python-headless>=4.8.0"
          "ruff>=0.8.0"
      - name: Test
        run: pytest -q
      - name: Lint
        run: ruff check api services shared tests
      - name: Compile Python sources
        run: python -m compileall -q api services shared tests

  web:
    name: Web build and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  mobile:
    name: Mobile type-check and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx expo-doctor
      - run: npm audit --omit=dev --audit-level=high

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose file
        env:
          TIMEKEEPER_ENV_FILE: .env.example
        run: docker compose --env-file .env.example config --quiet
