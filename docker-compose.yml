x-python-base: &python-base
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  volumes:
    - ./shared:/shared:ro

services:
  # ── Infrastructure ──────────────────────────────────────────────

  timescaledb:
    build: ./infra/db
    image: timekeeper-timescaledb:local
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgvector_pgdata_v4:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-migrate:
    build: ./infra/db
    image: timekeeper-timescaledb:local
    environment:
      PGHOST: timescaledb
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - ./infra/db/migrations:/migrations:ro
    depends_on:
      timescaledb:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        for migration in /migrations/*.sql; do
          version=$${migration##*/};
          version=$${version%.sql};
          applied=$$(psql -Atqc "SELECT 1 FROM schema_migrations WHERE version = '$$version'" 2>/dev/null || true);
          if [ "$$applied" = "1" ]; then
            echo "skipping applied migration $$version";
          else
            echo "applying $$migration";
            psql -v ON_ERROR_STOP=1 -f "$$migration" || exit 1;
          fi;
        done

  kafka:
    image: bitnamilegacy/kafka:3.6@sha256:287cec8bf1b254efe016ec66ea77628e31f242b09f3c68a15eec74d93c21a410
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: >-
        PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: >-
        CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Fresh topics get enough partitions for horizontally scaled vision.
      # Existing topics can be expanded with
      # kafka-topics.sh; Kafka never shrinks a topic.
      KAFKA_CFG_NUM_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-4}
    volumes:
      - kafkadata:/bitnami/kafka
    ports:
      - "127.0.0.1:9092:9092"
    healthcheck:
      test: kafka-topics.sh --bootstrap-server localhost:9092 --list
      interval: 15s
      timeout: 10s
      retries: 5

  kafka-topics-init:
    image: bitnamilegacy/kafka:3.6@sha256:287cec8bf1b254efe016ec66ea77628e31f242b09f3c68a15eec74d93c21a410
    restart: "no"
    environment:
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-4}
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        case "$$KAFKA_TOPIC_PARTITIONS" in
          ''|*[!0-9]*|0) echo "KAFKA_TOPIC_PARTITIONS must be a positive integer" >&2; exit 1 ;;
        esac;
        for topic in omniscient.frames omniscient.detections omniscient.events omniscient.alerts; do
          kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$$topic" --partitions "$$KAFKA_TOPIC_PARTITIONS" \
            --replication-factor 1;
          current=$$(kafka-topics.sh --bootstrap-server kafka:9092 --describe \
            --topic "$$topic" | sed -n 's/.*PartitionCount:[[:space:]]*\([0-9][0-9]*\).*/\1/p' | head -n 1);
          if [ -z "$$current" ]; then
            echo "could not determine partition count for $$topic" >&2;
            exit 1;
          fi;
          if [ "$$current" -lt "$$KAFKA_TOPIC_PARTITIONS" ]; then
            kafka-topics.sh --bootstrap-server kafka:9092 --alter --topic "$$topic" \
              --partitions "$$KAFKA_TOPIC_PARTITIONS";
          fi;
        done
    depends_on:
      kafka:
        condition: service_healthy

  redis:
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: rustfs/rustfs:latest@sha256:b81d16a90ee25bd9511280127ca1471788c6e874cf0f0da759645f46b2dc1d74
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  ollama:
    image: ollama/ollama:latest@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592
    volumes:
      - ollamadata:/root/.ollama
    ports:
      # Keep the host's existing Ollama service undisturbed.
      - "127.0.0.1:11435:11434"
  # ── Application Services ─────────────────────────────────────────

  ingestion:
    <<: *python-base
    build: ./services/ingestion
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      DATABASE_URL: ${DATABASE_URL}
      TIMEZONE: ${TIMEZONE}
      CAMERA_RELOAD_INTERVAL_S: ${CAMERA_RELOAD_INTERVAL_S}
      FRAME_INTERVAL_S: ${FRAME_INTERVAL_S}
      FRAME_STORE_PATH: ${FRAME_STORE_PATH}
      PROVIDER_ALLOWED_CONTROL_HOSTS: ${PROVIDER_ALLOWED_CONTROL_HOSTS}
      RING_ACCESS_TOKEN: ${RING_ACCESS_TOKEN}
      RING_ACCESS_TOKEN_FILE: ${RING_ACCESS_TOKEN_FILE}
      RING_REFRESH_TOKEN: ${RING_REFRESH_TOKEN}
      RING_REFRESH_TOKEN_FILE: ${RING_REFRESH_TOKEN_FILE}
      RING_TOKEN_URL: ${RING_TOKEN_URL}
      RING_CLIENT_ID: ${RING_CLIENT_ID}
      RING_CLIENT_SECRET: ${RING_CLIENT_SECRET}
      RING_WHEP_URL_TEMPLATE: ${RING_WHEP_URL_TEMPLATE}
      NEST_ACCESS_TOKEN: ${NEST_ACCESS_TOKEN}
      NEST_ACCESS_TOKEN_FILE: ${NEST_ACCESS_TOKEN_FILE}
      NEST_REFRESH_TOKEN: ${NEST_REFRESH_TOKEN}
      NEST_REFRESH_TOKEN_FILE: ${NEST_REFRESH_TOKEN_FILE}
      NEST_TOKEN_URL: ${NEST_TOKEN_URL}
      NEST_CLIENT_ID: ${NEST_CLIENT_ID}
      NEST_CLIENT_SECRET: ${NEST_CLIENT_SECRET}
      NEST_PROJECT_ID: ${NEST_PROJECT_ID}
      ARLO_ACCESS_TOKEN: ${ARLO_ACCESS_TOKEN}
      ARLO_ACCESS_TOKEN_FILE: ${ARLO_ACCESS_TOKEN_FILE}
      ARLO_REFRESH_TOKEN: ${ARLO_REFRESH_TOKEN}
      ARLO_REFRESH_TOKEN_FILE: ${ARLO_REFRESH_TOKEN_FILE}
      ARLO_TOKEN_URL: ${ARLO_TOKEN_URL}
      ARLO_CLIENT_ID: ${ARLO_CLIENT_ID}
      ARLO_CLIENT_SECRET: ${ARLO_CLIENT_SECRET}
      ARLO_WHEP_URL_TEMPLATE: ${ARLO_WHEP_URL_TEMPLATE}
      WYZE_ACCESS_TOKEN: ${WYZE_ACCESS_TOKEN}
      WYZE_ACCESS_TOKEN_FILE: ${WYZE_ACCESS_TOKEN_FILE}
      WYZE_REFRESH_TOKEN: ${WYZE_REFRESH_TOKEN}
      WYZE_REFRESH_TOKEN_FILE: ${WYZE_REFRESH_TOKEN_FILE}
      WYZE_TOKEN_URL: ${WYZE_TOKEN_URL}
      WYZE_CLIENT_ID: ${WYZE_CLIENT_ID}
      WYZE_CLIENT_SECRET: ${WYZE_CLIENT_SECRET}
      WYZE_WHEP_URL_TEMPLATE: ${WYZE_WHEP_URL_TEMPLATE}
    volumes:
      - ./shared:/shared:ro
      - framesdata:/tmp/frames
      - ${TIMEKEEPER_SECRETS_DIR:-./secrets}:/run/secrets:ro
    depends_on:
      kafka-topics-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully

  vision:
    <<: *python-base
    build: ./services/vision
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      DATABASE_URL: ${DATABASE_URL}
      TIMEZONE: ${TIMEZONE}
      FRAME_STORE_PATH: ${FRAME_STORE_PATH}
      CAMERA_REFRESH_INTERVAL_S: ${CAMERA_REFRESH_INTERVAL_S}
      TORCH_DEVICE: ${TORCH_DEVICE}
      YOLO_MODEL: ${YOLO_MODEL}
      VISION_CONSUMER_GROUP: ${VISION_CONSUMER_GROUP:-vision-pipeline}
      VISION_MAX_POLL_INTERVAL_MS: ${VISION_MAX_POLL_INTERVAL_MS:-900000}
    volumes:
      - ./shared:/shared:ro
      - framesdata:/tmp/frames
    depends_on:
      kafka-topics-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
  event-processor:
    <<: *python-base
    build: ./services/event-processor
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      DATABASE_URL: ${DATABASE_URL}
      QUERY_ENGINE_URL: ${QUERY_ENGINE_URL}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      MEDIA_BUCKET: ${MEDIA_BUCKET}
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL}
      DEFAULT_RETENTION_DAYS: ${DEFAULT_RETENTION_DAYS}
      RETENTION_INTERVAL_SECONDS: ${RETENTION_INTERVAL_SECONDS}
      ENVIRONMENT: ${ENVIRONMENT}
      FRAME_STORE_PATH: ${FRAME_STORE_PATH}
      CAMERA_REFRESH_INTERVAL_S: ${CAMERA_REFRESH_INTERVAL_S}
      TIMEZONE: ${TIMEZONE}
    volumes:
      - ./shared:/shared:ro
      - framesdata:/tmp/frames
    depends_on:
      kafka-topics-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started

  query-engine:
    <<: *python-base
    build: ./services/query-engine
    environment:
      DATABASE_URL: ${DATABASE_URL}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      TIMEZONE: ${TIMEZONE}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      ollama:
        condition: service_started

  alert-engine:
    <<: *python-base
    build: ./services/alert-engine
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      DATABASE_URL: ${DATABASE_URL}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER}
      FCM_SERVER_KEY: ${FCM_SERVER_KEY}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID}
      FCM_SERVICE_ACCOUNT_FILE: ${FCM_SERVICE_ACCOUNT_FILE}
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON}
      TIMEZONE: ${TIMEZONE}
    volumes:
      - ${TIMEKEEPER_SECRETS_DIR:-./secrets}:/run/secrets:ro
    depends_on:
      kafka-topics-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully

  api:
    <<: *python-base
    build: ./api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ENVIRONMENT: ${ENVIRONMENT}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      TIMEZONE: ${TIMEZONE}
      QUERY_ENGINE_URL: ${QUERY_ENGINE_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      MEDIA_BUCKET: ${MEDIA_BUCKET}
      CLIP_URL_TTL_SECONDS: ${CLIP_URL_TTL_SECONDS}
      DEFAULT_RETENTION_DAYS: ${DEFAULT_RETENTION_DAYS}
      PIPEDREAM_PROJECT_ID: ${PIPEDREAM_PROJECT_ID}
      PIPEDREAM_ENVIRONMENT: ${PIPEDREAM_ENVIRONMENT}
      PIPEDREAM_CLIENT_ID: ${PIPEDREAM_CLIENT_ID}
      PIPEDREAM_CLIENT_SECRET: ${PIPEDREAM_CLIENT_SECRET}
      PIPEDREAM_SUCCESS_REDIRECT_URI: ${PIPEDREAM_SUCCESS_REDIRECT_URI}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      kafka-topics-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  pgvector_pgdata_v4:
  kafkadata:
  redisdata:
  miniodata:
  ollamadata:
  framesdata:
