x-python-base: &python-base
  restart: unless-stopped
  env_file: ${TIMEKEEPER_ENV_FILE:-.env}
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  volumes:
    - ./shared:/shared:ro

services:
  # ── Infrastructure ──────────────────────────────────────────────

  timescaledb:
    build: ./infra/db
    image: timekeeper-timescaledb:local
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgvector_pgdata_v4:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-migrate:
    build: ./infra/db
    image: timekeeper-timescaledb:local
    environment:
      PGHOST: timescaledb
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - ./infra/db/migrations:/migrations:ro
    depends_on:
      timescaledb:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        for migration in /migrations/*.sql; do
          version=$${migration##*/};
          version=$${version%.sql};
          applied=$$(psql -Atqc "SELECT 1 FROM schema_migrations WHERE version = '$$version'" 2>/dev/null || true);
          if [ "$$applied" = "1" ]; then
            echo "skipping applied migration $$version";
          else
            echo "applying $$migration";
            psql -v ON_ERROR_STOP=1 -f "$$migration" || exit 1;
          fi;
        done

  kafka:
    image: bitnamilegacy/kafka:3.6@sha256:287cec8bf1b254efe016ec66ea77628e31f242b09f3c68a15eec74d93c21a410
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: >-
        PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: >-
        CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafkadata:/bitnami/kafka
    ports:
      - "127.0.0.1:9092:9092"
    healthcheck:
      test: kafka-topics.sh --bootstrap-server localhost:9092 --list
      interval: 15s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"

  minio:
    image: rustfs/rustfs:latest@sha256:b81d16a90ee25bd9511280127ca1471788c6e874cf0f0da759645f46b2dc1d74
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  ollama:
    image: ollama/ollama:latest@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592
    volumes:
      - ollamadata:/root/.ollama
    ports:
      # Keep the host's existing Ollama service undisturbed.
      - "127.0.0.1:11435:11434"
  # ── Application Services ─────────────────────────────────────────

  ingestion:
    <<: *python-base
    build: ./services/ingestion
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      DATABASE_URL: ${DATABASE_URL}
      RING_ACCESS_TOKEN: ${RING_ACCESS_TOKEN}
      RING_ACCESS_TOKEN_FILE: ${RING_ACCESS_TOKEN_FILE}
      NEST_ACCESS_TOKEN: ${NEST_ACCESS_TOKEN}
      NEST_ACCESS_TOKEN_FILE: ${NEST_ACCESS_TOKEN_FILE}
      NEST_PROJECT_ID: ${NEST_PROJECT_ID}
      ARLO_ACCESS_TOKEN: ${ARLO_ACCESS_TOKEN}
      ARLO_ACCESS_TOKEN_FILE: ${ARLO_ACCESS_TOKEN_FILE}
      WYZE_ACCESS_TOKEN: ${WYZE_ACCESS_TOKEN}
      WYZE_ACCESS_TOKEN_FILE: ${WYZE_ACCESS_TOKEN_FILE}
    volumes:
      - ./shared:/shared:ro
      - framesdata:/tmp/frames
    depends_on:
      kafka:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  vision:
    <<: *python-base
    build: ./services/vision
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./shared:/shared:ro
      - framesdata:/tmp/frames
    depends_on:
      kafka:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
  event-processor:
    <<: *python-base
    build: ./services/event-processor
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      DATABASE_URL: ${DATABASE_URL}
      QUERY_ENGINE_URL: ${QUERY_ENGINE_URL}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      MEDIA_BUCKET: ${MEDIA_BUCKET}
      DEFAULT_RETENTION_DAYS: ${DEFAULT_RETENTION_DAYS}
      RETENTION_INTERVAL_SECONDS: ${RETENTION_INTERVAL_SECONDS}
    volumes:
      - ./shared:/shared:ro
      - framesdata:/tmp/frames
    depends_on:
      kafka:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started

  query-engine:
    <<: *python-base
    build: ./services/query-engine
    environment:
      DATABASE_URL: ${DATABASE_URL}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      ollama:
        condition: service_started

  alert-engine:
    <<: *python-base
    build: ./services/alert-engine
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      DATABASE_URL: ${DATABASE_URL}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER}
      FCM_SERVER_KEY: ${FCM_SERVER_KEY}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID}
      FCM_SERVICE_ACCOUNT_FILE: ${FCM_SERVICE_ACCOUNT_FILE}
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON}
    depends_on:
      kafka:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  api:
    <<: *python-base
    build: ./api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ENVIRONMENT: ${ENVIRONMENT}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      QUERY_ENGINE_URL: ${QUERY_ENGINE_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      MEDIA_BUCKET: ${MEDIA_BUCKET}
      CLIP_URL_TTL_SECONDS: ${CLIP_URL_TTL_SECONDS}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

volumes:
  pgvector_pgdata_v4:
  kafkadata:
  redisdata:
  miniodata:
  ollamadata:
  framesdata:
